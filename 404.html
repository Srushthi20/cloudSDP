<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Page not found | Srushthi M S</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#EFF0F6;--fg:#12131F;--muted:#575A70;--accent:#2F3CF5;--accent-fg:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#0D0E18;--fg:#ECEDF7;--muted:#9A9DB8;--accent:#8C96FF;--accent-fg:#0D0E18}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Helvetica Neue',Arial,sans-serif;display:grid;place-items:center;padding:24px}
main{max-width:560px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(48px,12vw,104px);line-height:.95;letter-spacing:-.03em;margin:12px 0 16px}
h1 span{color:var(--accent)}
p{color:var(--muted);font-size:18px;line-height:1.5;margin:0 0 28px}
a{display:inline-block;background:var(--accent);color:var(--accent-fg);text-decoration:none;font-weight:600;padding:14px 22px;border-radius:999px}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<main>
  <span class="code">Error 404</span>
  <h1>Lost in the <span>joins.</span></h1>
  <p>This page does not exist, or it moved. The portfolio home page has everything.</p>
  <a href="/">Back to the portfolio</a>
</main>
</body>
</html>
